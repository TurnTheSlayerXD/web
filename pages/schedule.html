<main>

    <p class='custom_date_unput'>
        <label for="date">Выберите неделю </label>
        <input type="date" id="date" name="date"/>
    </p>


    <template id="template_days_of_week">
        <tr>
            <th class=table_header>
            </th>
        </tr>
        <tr>
            <td>Время</td>
            <td>Понедельник</td>
            <td>Вторник</td>
            <td>Среда</td>
            <td>Четверг</td>
            <td>Пятница</td>
            <td>Суббота</td>
            <td>Воскресенье</td>
        </tr>
    </template>

    <template id='template_time'>

        <form class="table_input_form" method="get" autocomplete="on">
            <label>
                <textarea class="time_input"> </textarea>
            </label>

        </form>
    </template>

    <template id='template_task'>
        <form class="table_input_form" method="get" autocomplete="on">
            <label>
                <textarea class="task_input"> </textarea>
            </label>
        </form>
    </template>
